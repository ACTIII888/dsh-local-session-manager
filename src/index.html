<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness 本地会话管理工具</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />    <style>
{{STYLES}}
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="surface hero">
        <div class="hero-main">
          <h1 id="hero-title">DeepSeek Harness 本地会话管理工具</h1>
          <p id="hero-description" class="hero-description">
            数据仅在浏览器本地处理, 不会发送到任何第三方或后端
          </p>
          <p id="support-hint" class="support-hint"></p>
        </div>

        <div class="hero-side">
          <div class="hero-side-top">
            <button
              id="locale-toggle-button"
              class="secondary-button locale-button"
              type="button"
              aria-label="Switch to English"
              title="Switch to English"
            >
              EN
            </button>
            <button
              id="theme-toggle-button"
              class="theme-button icon-button"
              type="button"
              aria-label="切换主题"
              title="切换主题"
            ></button>
          </div>
        </div>
      </header>

      <main class="workspace">
        <div class="top-panels">
          <section class="surface compact-surface">
            <div class="section-head">
              <h2 id="status-title" class="section-title">状态</h2>
              <span id="status-badge" class="badge" data-tone="neutral">未连接</span>
            </div>
            <p id="status-text" class="body-copy">未选择目录</p>
            <dl class="meta-grid compact-meta">
              <div>
                <dt id="status-directory-label">目录</dt>
                <dd id="status-directory">-</dd>
              </div>
              <div>
                <dt id="status-scanned-label">扫描</dt>
                <dd id="status-scanned-at">-</dd>
              </div>
            </dl>
            <div class="compact-actions status-actions">
              <div class="status-action-row primary-row">
                <button id="pick-directory-button" class="primary-button toolbar-button" type="button">
                  选择目录
                </button>
                <button id="reload-button" class="secondary-button toolbar-button" type="button" disabled>
                  重新扫描
                </button>
              </div>
              <div class="status-action-row secondary-row">
                <button id="delete-all-button" class="danger-button subtle toolbar-button" type="button" disabled>
                  删除全部
                </button>
                <button id="cleanup-stale-button" class="secondary-button toolbar-button" type="button" disabled>
                  清理脏索引
                </button>
              </div>
            </div>
          </section>

          <section class="surface compact-surface">
            <div class="section-head">
              <h2 id="filter-title" class="section-title">筛选</h2>
            </div>
            <div class="filter-grid">
              <label class="field search-field">
                <span id="metadata-search-label">标题 / 摘要 / ID</span>
                <input id="search-input" type="search" placeholder="标题 / 摘要 / ID" />
              </label>
              <label class="field search-field">
                <span id="conversation-search-label">用户 / 助手正文</span>
                <input id="conversation-search-input" type="search" placeholder="用户 / 助手正文" />
              </label>
              <label class="field filter-control">
                <span id="age-filter-label">时间</span>
                <select id="age-filter">
                  <option id="age-option-all" value="all">全部</option>
                  <option id="age-option-7d" value="7d">近 7 天</option>
                  <option id="age-option-30d" value="30d">近 30 天</option>
                  <option id="age-option-older" value="older">30 天前</option>
                </select>
              </label>
              <label class="field filter-control">
                <span id="exact-date-label">精确日期</span>
                <input id="exact-date-input" type="text" inputmode="numeric" maxlength="10" placeholder="yyyy/mm/dd" />
              </label>
              <label class="field filter-control">
                <span id="sort-label">排序</span>
                <select id="sort-select">
                  <option id="sort-option-updated" value="updated-desc">最近更新</option>
                  <option id="sort-option-size" value="size-desc">文件大小</option>
                  <option id="sort-option-title" value="title-asc">标题 A-Z</option>
                </select>
              </label>
              <label class="checkbox-row filter-checkbox">
                <input id="stale-only-checkbox" type="checkbox" />
                <span id="stale-only-label">只看脏索引</span>
              </label>
            </div>
          </section>

          <section class="surface compact-surface metrics-surface">
            <div class="section-head">
              <h2 id="metrics-title" class="section-title">统计</h2>
            </div>
            <div class="metric-grid">
              <article class="metric-card">
                <span id="metric-total-label" class="metric-label">会话总数</span>
                <strong id="metric-total">-</strong>
              </article>
              <article class="metric-card">
                <span id="metric-filtered-label" class="metric-label">筛选结果</span>
                <strong id="metric-filtered">-</strong>
              </article>
              <article class="metric-card">
                <span id="metric-size-label" class="metric-label">总大小</span>
                <strong id="metric-size">-</strong>
              </article>
              <article class="metric-card">
                <span id="metric-stale-label" class="metric-label">脏索引</span>
                <strong id="metric-stale">-</strong>
              </article>
              <article class="metric-card">
                <span id="metric-selected-label" class="metric-label">已选中</span>
                <strong id="metric-selected">0</strong>
              </article>
            </div>
          </section>
        </div>

        <div class="bottom-panels">
          <section class="surface list-surface">
            <div class="section-head">
              <div>
                <h2 id="list-title" class="section-title">会话列表</h2>
                <p id="list-caption" class="section-description">未扫描</p>
              </div>
              <div class="list-head-right">
                <button id="select-page-button" class="secondary-button small" type="button" disabled>
                  全选当前页
                </button>
                <button id="delete-selected-button" class="danger-button small" type="button" disabled hidden>
                  删除选中
                </button>
              </div>
            </div>

            <div class="list-scroll">
              <div id="session-list" class="session-list"></div>
            </div>

            <div class="pagination-bar">
              <button id="prev-page-button" class="secondary-button small" type="button" disabled>
                上一页
              </button>
              <span id="page-indicator" class="page-indicator">第 0 / 0 页</span>
              <button id="next-page-button" class="secondary-button small" type="button" disabled>
                下一页
              </button>
              <label class="inline-field pagination-size">
                <span id="page-size-label">每页显示</span>
                <select id="page-size-select">
                  <option value="10" selected>10</option>
                  <option value="20">20</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select>
              </label>
            </div>
          </section>

          <section class="surface detail-surface">
          <div class="section-head">
            <div>
              <h2 id="detail-section-title" class="section-title">详情</h2>
              <p id="detail-caption" class="section-description">未选择会话</p>
            </div>
            <div class="detail-actions">
              <div class="detail-action-row">
                <button id="download-current-button" class="secondary-button small" type="button" disabled>
                  下载 JSONL
                </button>
                <button id="download-raw-button" class="secondary-button small" type="button" disabled>
                  下载原始
                </button>
                <button id="delete-current-button" class="danger-button small" type="button" disabled>
                  删除
                </button>
              </div>
            </div>
          </div>

          <div id="detail-scroll" class="detail-scroll">
            <div class="detail-block">
              <dl id="detail-overview" class="meta-grid">
                <div>
                  <dt id="detail-overview-default-label">会话 ID</dt>
                  <dd>-</dd>
                </div>
              </dl>
            </div>

            <div class="detail-block">
              <div class="section-head compact conversation-heading">
                <div class="conversation-title-wrap">
                  <h2 id="detail-preview-title" class="section-title">完整对话</h2>
                  <span id="detail-message-count" class="badge">0</span>
                </div>
                <div id="conversation-filter" class="conversation-filter" aria-label="语块筛选"></div>
              </div>
              <div id="detail-preview" class="conversation-stream">
                <p class="empty-state">暂无会话内容.</p>
              </div>
            </div>
          </div>
          </section>
        </div>
      </main>
    </div>

    <div id="confirm-modal" class="modal" hidden data-variant="danger">
      <div id="modal-backdrop" class="modal-backdrop"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <div id="modal-icon" class="modal-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 8v5"></path>
              <path d="M12 16.5h.01"></path>
              <path d="M10.3 3.8 2.9 17a2 2 0 0 0 1.8 3h14.6a2 2 0 0 0 1.8-3L13.7 3.8a2 2 0 0 0-3.4 0Z"></path>
            </svg>
          </div>
          <div class="modal-copy">
            <h2 id="modal-title" class="section-title">确认删除</h2>
            <p id="modal-subtitle" class="modal-subtitle">危险操作</p>
          </div>
        </div>
        <div class="modal-summary">
          <div id="modal-summary-head" class="modal-summary-head">即将执行</div>
          <div>
            <div id="modal-description" class="section-description"></div>
          </div>
        </div>
        <div class="modal-warning-box">
          <div id="modal-warning" class="body-copy"></div>
        </div>
        <div class="modal-actions">
          <button id="modal-cancel-button" class="secondary-button" type="button">取消</button>
          <button id="modal-confirm-button" class="danger-button small" type="button" disabled>
            确认删除
          </button>
        </div>
      </div>
    </div>

    <template id="session-item-template">
      <article class="session-item">
        <label class="session-select">
          <input type="checkbox" class="session-checkbox" />
          <span></span>
        </label>
        <button class="session-main" type="button">
          <div class="session-row">
            <strong class="session-title"></strong>
            <span class="session-size"></span>
          </div>
          <div class="session-row meta">
            <span class="session-id"></span>
            <span class="session-updated"></span>
          </div>
          <div class="session-summary"></div>
        </button>
      </article>
    </template>

    <script id="dsh-worker-source" type="text/dsh-worker">
{{WORKER_JS}}
    </script>

    <script>
{{APP_JS}}
    </script>
  </body>
</html>
